# Databricks App manifest — CONSOLE (the operator wizard UI).
#
# This is the primary product surface. The MCP server ships as a second app
# (see deploy/mcp.app.yaml). The App runtime injects DATABRICKS_APP_NAME (which
# flips the code into "app mode"), DATABRICKS_HOST, an OAuth token for the app's
# service principal, and — when a Database resource is attached — PGHOST/PGUSER/
# PGDATABASE/PGPORT.
#
# Deploy:  databricks apps deploy <name> --source-code-path <ws path> -p welchco-aws
command: ["python", "-m", "pseudo_domo_mcp.webapp.app"]
env:
  - name: PORT
    value: "8000"
  # Fixtures for now — flip to "live" once Domo tenant creds are set as App
  # secrets (DOMO_CLIENT_ID / DOMO_CLIENT_SECRET).
  - name: PSEUDO_DOMO_PROVIDER
    value: "fixture"
  # Durable, shared state in Lakebase (scans, mappings, dispositions, config).
  - name: PSEUDO_DOMO_STORE_BACKEND
    value: "lakebase"
  - name: PSEUDO_DOMO_LAKEBASE_INSTANCE
    value: "welchco-lakebase"
  # Optional LLM enhancement via a foundation-model pay-per-token endpoint.
  # The app's service principal authenticates (no static token). Attach this
  # endpoint as a "Model serving" resource with CAN_QUERY.
  - name: PSEUDO_DOMO_LLM_ENDPOINT
    value: "databricks-claude-sonnet-5"
